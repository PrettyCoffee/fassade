name: Build / Validate

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch: # Allows to run this workflow manually

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@v3.0.0
        with:
          version: 11.28.0
          runtime: node@24.21.0
          install: true
          require-lockfile: true

      - name: Build project
        run: pnpm run build

      - name: Lint code
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm run test:coverage
